<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>协议详情</title>
  <link rel="stylesheet" href="fonts/partner-ui-fonts.css">
  <link rel="stylesheet" href="runtime/partner-ui-runtime.css">
  <style>
    .page-head { display: flex; align-items: flex-start; justify-content: space-between; gap: var(--wb-spacing-component-lg); }
    .page-head .meta { display: flex; align-items: center; gap: var(--wb-spacing-component-sm); margin-top: var(--wb-spacing-component-xs); }
    /* 底部操作栏：说明左、操作右（按钮摆放 pattern） */
    .action-bar { position: sticky; bottom: 0; z-index: 2; background: var(--wb-color-surface-container); box-shadow: var(--wb-shadow-t-m);
      padding-block: var(--wb-spacing-page-action-bar-padding-block); }
    .action-bar .pui-container { display: flex; align-items: center; justify-content: space-between; gap: var(--wb-spacing-component-lg); }
  </style>
</head>
<body class="pui-page">
<div id="app"></div>

<script type="text/x-template" id="page">
  <WorkbenchTopNav :tabs="nav.tabs" :sites="nav.sites" v-model:active-tab="nav.active" />

  <main class="pui-container pui-stack" style="padding-block: var(--wb-spacing-component-lg) var(--wb-spacing-layout-section-gap-large)">
    <WorkbenchBreadcrumb :items="crumbs" @navigate="(item, e) => e?.preventDefault()" />

    <header class="page-head">
      <div>
        <h1 class="pui-title-xl">{{ model.name }}</h1>
        <div class="meta">
          <WorkbenchTag :label="model.status" variant="status-subtle" size="small" :status="statusTone[model.status]" />
          <span class="pui-text-s">{{ model.id }} · 最近更新 2026-10-28</span>
        </div>
      </div>
      <div class="pui-row">
        <WorkbenchDropdown :items="moreItems" aria-label="更多操作" @action="onMore"><template #trigger>更多</template></WorkbenchDropdown>
        <WorkbenchButton v-if="!editing" appearance="secondary" @click="startEdit">编辑</WorkbenchButton>
        <WorkbenchButton appearance="primary" :disabled="editing || model.status !== '待续签'" @click="renewOpen = true">发起续签</WorkbenchButton>
      </div>
    </header>

    <WorkbenchAlert v-if="model.status === '待续签'" type="warning" placement="page" :show-close="false"
      message="该协议将于 2026-11-30 到期，请在到期前 15 天完成续签审批。" />

    <section class="pui-surface">
      <WorkbenchSteps :items="steps" :model-value="stepIndex" :current="stepIndex" aria-label="协议生命周期" />
    </section>

    <section class="pui-surface pui-stack">
      <WorkbenchTabs v-model="tab" :items="tabs" variant="basic" size="large" aria-label="协议详情" />

      <!-- 基本信息：同一个 Form 切换只读 / 编辑 -->
      <WorkbenchForm v-if="tab === 'info'" ref="form" title="基本信息" :title-visible="false" :model="model"
        :mode="editing ? 'mixed' : 'readonly'" label-position="left" @submit="save">
        <WorkbenchFormGroup label="协议信息">
          <WorkbenchFormItem label="协议名称" prop="name" required :rules="[{ required: true, message: '请输入协议名称' }]">
            <WorkbenchInput v-model="model.name" aria-label="协议名称" />
          </WorkbenchFormItem>
          <WorkbenchFormItem label="协议类型" prop="type" :formatter="(v) => typeLabel[v]">
            <WorkbenchSelect :model-value="[model.type]" :options="typeOptions" label="协议类型" teleport-panel @update:model-value="model.type = $event[0]" />
          </WorkbenchFormItem>
          <WorkbenchFormItem label="到期日期" prop="endDate">
            <WorkbenchDatePicker v-model="model.endDate" aria-label="到期日期" />
          </WorkbenchFormItem>
          <WorkbenchFormItem label="协议金额" prop="amount" :formatter="(v) => Number(v).toLocaleString('zh-CN')">
            <WorkbenchInput v-model="model.amount" aria-label="协议金额" />
          </WorkbenchFormItem>
        </WorkbenchFormGroup>
        <WorkbenchFormGroup label="合作方">
          <WorkbenchFormItem label="合作伙伴" prop="partner" mode="readonly" />
          <WorkbenchFormItem label="协议负责人" prop="owner" required :rules="[{ required: true, message: '请输入负责人' }]">
            <WorkbenchInput v-model="model.owner" aria-label="协议负责人" />
          </WorkbenchFormItem>
          <WorkbenchFormItem label="自动续签" prop="autoRenew" :formatter="(v) => (v ? '开启' : '关闭')">
            <WorkbenchSwitch v-model="model.autoRenew" aria-label="自动续签" />
          </WorkbenchFormItem>
        </WorkbenchFormGroup>
      </WorkbenchForm>

      <WorkbenchUploadFileList v-else-if="tab === 'files'" :files="files" />

      <WorkbenchTimeline v-else :items="history" node-type="dot" label="操作记录" />
    </section>

    <WorkbenchCollapse>
      <WorkbenchCollapseItem title="页面说明">
        <p class="pui-text">演示数据，未连接真实服务。新建组件：无。</p>
      </WorkbenchCollapseItem>
    </WorkbenchCollapse>
  </main>

  <!-- 编辑态底部操作栏 -->
  <div v-if="editing" class="action-bar">
    <div class="pui-container">
      <span class="pui-text-s">修改后需重新提交审批</span>
      <div class="pui-row">
        <WorkbenchButton appearance="secondary" size="36" @click="cancelEdit">取消</WorkbenchButton>
        <WorkbenchButton appearance="primary" size="36" @click="$refs.form.submit()">保存</WorkbenchButton>
      </div>
    </div>
  </div>

  <WorkbenchFooter v-else :registration="{ id: 'registration', label: '' }" />

  <WorkbenchFeedbackDialog v-model="renewOpen" type="info" title="确认发起续签？" message="将基于当前版本创建续签申请，提交后进入审批流程。"
    :primary-action="{ id: 'ok', label: '确认发起' }" :secondary-action="{ id: 'cancel', label: '再想想' }" :action-handler="renew" />
  <GlobalMessageStack :items="messages" @dismiss="(e) => messages = messages.filter((m) => m.id !== e.id)" />
</script>

<script src="runtime/partner-ui-runtime.js"></script>
<script>
const { ref, reactive } = Vue
PartnerUI.mount('#app', {
  template: '#page',
  setup() {
    const nav = reactive({ active: 'sales', tabs: [{ value: 'home', label: '首页' }, { value: 'sales', label: '销售' }, { value: 'service', label: '服务' }], sites: [{ value: 'partner', label: '企业伙伴网站' }] })
    const crumbs = [{ id: 'home', label: '首页', href: '#' }, { id: 'list', label: '协议管理', href: '#' }, { id: 'cur', label: '协议详情' }]
    const statusTone = { 生效中: 'success', 待续签: 'warning', 审批中: 'info', 已到期: 'none' }
    const typeOptions = [{ value: 'dist', label: '分销框架协议' }, { value: 'service', label: '服务协议' }, { value: 'solution', label: '解决方案协议' }]
    const typeLabel = Object.fromEntries(typeOptions.map((o) => [o.value, o.label]))
    const original = { id: 'HT-2026-0101', name: '华东区分销框架协议', type: 'dist', endDate: '2026-11-30', amount: '1280000',
      partner: '星河科技有限公司', owner: '王敏', autoRenew: false, status: '待续签' }
    const model = reactive({ ...original })
    const editing = ref(false)
    const tab = ref('info')
    const tabs = [{ value: 'info', label: '基本信息' }, { value: 'files', label: '协议附件' }, { value: 'history', label: '操作记录' }]
    const steps = [{ title: '起草' }, { title: '审批' }, { title: '签署' }, { title: '履约中' }, { title: '续签' }]
    const stepIndex = ref(3)
    const files = [
      { id: 'f1', name: '华东区分销框架协议-V3.pdf', size: 2457600, status: 'success' },
      { id: 'f2', name: '附件一：价格表.xlsx', size: 184320, status: 'success' },
    ]
    const history = [
      { id: 'h3', time: '2026-10-28 14:20', title: '王敏 更新了协议负责人' },
      { id: 'h2', time: '2026-03-01 09:00', title: '协议生效', description: '双方完成电子签署' },
      { id: 'h1', time: '2026-02-20 16:45', title: '李华 提交审批' },
    ]
    const moreItems = [{ id: 'copy', type: 'action', label: '复制协议' }, { id: 'export', type: 'action', label: '导出 PDF' }]
    const renewOpen = ref(false)
    const messages = ref([])
    const notify = (message, type = 'success') => { messages.value = [{ id: Date.now() + Math.random(), message, type }, ...messages.value] }

    function startEdit() { tab.value = 'info'; editing.value = true }
    function cancelEdit() { Object.assign(model, original); editing.value = false }
    function save() { Object.assign(original, model); editing.value = false; notify('已保存') }
    async function renew(action) {
      if (action.id === 'ok') { await new Promise((r) => setTimeout(r, 600)); model.status = '审批中'; stepIndex.value = 4; notify('续签申请已提交') }
      return true
    }
    function onMore({ id }) { notify(`${moreItems.find((m) => m.id === id).label}（演示）`, 'info') }
    return { nav, crumbs, statusTone, typeOptions, typeLabel, model, editing, tab, tabs, steps, stepIndex, files, history,
      moreItems, renewOpen, messages, startEdit, cancelEdit, save, renew, onMore }
  },
})
</script>
</body>
</html>
