name: Standalone skills smoke
on:
  workflow_dispatch:
  push:
    branches: [codex/skill-cross-platform-packaging-20261112]
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify:lock
      - run: pnpm build
      - uses: actions/upload-artifact@v4
        with:
          name: standalone-smoke-zips
          path: dist/*.zip
  smoke:
    needs: package
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      SKILLS_DIST: ${{ runner.temp }}/isolated-skills
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: standalone-smoke-zips
          path: archives
      - name: Extract independent skills
        shell: bash
        run: python -c "import os,pathlib,zipfile; [zipfile.ZipFile(p).extractall(os.environ['SKILLS_DIST']) for p in pathlib.Path('archives').glob('*.zip')]"
      - name: Verify standalone usage
        run: node tests/standalone-smoke.mjs
        env:
          SKILLS_PYTHON: python
          SKILLS_SMOKE_INSTALL_REVIEW: '1'
